[workspace]
resolver = "2"
members = [
    "shared",
    "register",
    "progress",
    "subscription",
    "connection",
    "player_token",
]

[workspace.dependencies]
# testutils is NOT listed here: it's unsupported on the wasm target (see
# soroban-sdk's own compile_error!), so it must only be enabled by the
# non-wasm dev-dependencies declarations in each member crate below, not
# inherited into every crate's default (wasm-targeted) [dependencies].
soroban-sdk = { version = "28.0.0" }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
