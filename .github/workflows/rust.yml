name: Rust CI

on:
  push:
    branches: [ main, design-a-migration-strategy ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts (optimized WASM)
        run: cargo build --workspace --target wasm32-unknown-unknown --release
        working-directory: contracts

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
        working-directory: contracts

      - name: Report optimized WASM sizes
        run: bash scripts/report-contract-wasm-size.sh

      # contracts/.cargo/config.toml pins wasm32-unknown-unknown as the default
      # build target for the workspace, so host-target test runs must pass
      # --target explicitly or rustc fails to find `core` for the host.
      - name: Run cargo test for player-token
        run: |
          cd contracts/player_token
          cargo test -p player-token --target x86_64-unknown-linux-gnu --verbose
