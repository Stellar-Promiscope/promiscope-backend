# Deploy Promiscope backend to staging on every merge to main.
#
# Required GitHub Environment: staging
# Configure at Settings → Environments → staging
#
# Secrets (scoped to the staging environment):
#   STAGING_HOST              — staging server hostname or IP
#   STAGING_SSH_USER          — SSH user for deployment
#   STAGING_SSH_PRIVATE_KEY   — private key for SSH/SCP (PEM)
#   STAGING_DEPLOY_PATH       — absolute path on the server (e.g. /var/www/promiscope-backend)
#   STAGING_URL               — public staging base URL for smoke tests (e.g. https://api.staging.example.com)
#   STAGING_DEPLOY_NOTIFY_WEBHOOK — (optional) Slack/Discord webhook URL for failure alerts
#
# Runtime env vars (CONTRACT_ID, JWT_SECRET, etc.) live in the server .env file;
# see DEPLOYMENT.md.

name: Deploy Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub Actions forbids the `secrets` context in a job-level `if:`, so probe
  # for the deploy credentials in a step and expose the result as an output the
  # deploy job can gate on. When the `staging` environment has no
  # STAGING_SSH_PRIVATE_KEY configured, the deploy + smoke-test jobs are skipped
  # (a neutral result) instead of failing every push to main.
  preflight:
    name: Check deploy config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$STAGING_SSH_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Staging deploy skipped::STAGING_SSH_PRIVATE_KEY is not configured on the staging environment; the deploy and smoke-test jobs will be skipped."
          fi

  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `cache: npm` caches ~/.npm keyed on Node.js version + package-lock.json
      # hash, so `npm ci` below is fast on a cache hit and self-invalidates
      # whenever dependencies change.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Validate env example
        run: node scripts/validate-env.js

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
          JWT_SECRET: test-secret
          DB_PATH: ':memory:'

      - name: Build
        run: npm run build

      - name: Dry-run deploy script ordering
        # Validates that the deploy script's dependency/build ordering is correct:
        # npm ci (full, devDependencies included) → npm run build → npm prune --omit=dev.
        # This mirrors what scripts/deploy-staging.sh does on the staging server and
        # confirms tsc (a devDependency) is available when the build step runs.
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
          # Confirm dist/index.js was produced by the build step
          test -f dist/index.js || (echo "ERROR: dist/index.js not found after build" && exit 1)
          echo "Deploy script ordering dry-run passed ✓"

      - name: Write build commit
        run: echo "${{ github.sha }}" > BUILD_COMMIT

      - name: Package release
        run: |
          # Write the archive outside the directory being archived. Even with
          # --exclude=release.tar.gz, tar still stats the containing directory
          # (`.`) as it walks it — creating the output file inside that same
          # directory changes its mtime mid-walk and tar unconditionally exits
          # 1 for "file changed as we read it" (--warning=KEYWORD only
          # silences the message, it doesn't stop the exit). Writing to
          # RUNNER_TEMP sidesteps the self-reference entirely.
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=coverage \
            .
          mv "$RUNNER_TEMP/release.tar.gz" release.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: staging-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to staging
    needs: [preflight, build]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      # environment.url does not support the secrets context directly, so
      # resolve it through a step output instead (steps.<id>.outputs.* is
      # allowed here).
      url: ${{ steps.set-url.outputs.url }}
    steps:
      - name: Resolve staging URL
        id: set-url
        run: echo "url=${{ secrets.STAGING_URL }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: staging-release

      - name: Upload release to staging server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: ${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Extract and restart service
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            tar xzf release.tar.gz
            rm -f release.tar.gz
            chmod +x scripts/deploy-staging.sh
            bash scripts/deploy-staging.sh "$DEPLOY_PATH"

  smoke-test:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Verify GET /health
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          HEALTH_URL="${STAGING_URL%/}/health"
          echo "Smoke testing ${HEALTH_URL}"
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsSL "$HEALTH_URL")"
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "Health check passed: $body"
              exit 0
            fi
            echo "Attempt ${attempt} failed (body: $body); retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed: GET /health did not return status ok"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            bash scripts/deploy-staging.sh "$DEPLOY_PATH" rollback

  notify-failure:
    name: Notify on failure
    needs: [build, deploy, smoke-test]
    if: >-
      always() && (
        needs.build.result == 'failure' ||
        needs.deploy.result == 'failure' ||
        needs.smoke-test.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deployment failure notification
        env:
          WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "STAGING_DEPLOY_NOTIFY_WEBHOOK not configured; skipping notification"
            exit 0
          fi
          payload=$(cat <<EOF
          {
            "text": "Staging deployment failed for ${{ github.repository }}@${{ github.sha }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          curl -fsSL -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${payload}"
