name: Contract CI
on:
  push:
    paths: ['contracts/**']
  pull_request:
    paths: ['contracts/**']

# Cancel in-progress runs for the same branch/ref when a new push arrives.
# Rust/Cargo builds are slow — redundant parallel runs are proportionally
# costly, so cancelling stale runs as early as possible saves significant
# CI minutes on rapid iterative pushes.
concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-${{ runner.os }}-contracts

      - name: Build contracts (WASM)
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: contracts

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
        working-directory: contracts

      - name: Report optimized WASM sizes
        run: bash scripts/report-contract-wasm-size.sh

      # contracts/.cargo/config.toml sets wasm32-unknown-unknown as the
      # default build target for this workspace, so host-target commands
      # must pass --target explicitly or they'll silently try to build (and
      # fail to link/run) against wasm instead.
      - name: Run unit tests
        run: cargo test --workspace --lib --target x86_64-unknown-linux-gnu
        working-directory: contracts

      # Property-based invariant fuzz tests live in each contract's tests/ directory.
      # PROPTEST_CASES controls the number of random inputs per test via each
      # file's own proptest_cases() helper (ProptestConfig::with_cases doesn't
      # read the env itself once a literal case count is passed to it). The
      # default is 10 000, matching the in-code default; CI overrides this to
      # a lower number for fast feedback within its time budget, keeping the
      # full 10 000 run available locally and on nightly.
      - name: Run invariant fuzz tests
        env:
          PROPTEST_CASES: ${{ vars.PROPTEST_CASES || '256' }}
        run: cargo test --workspace --tests --target x86_64-unknown-linux-gnu -- invariants
        working-directory: contracts
