# Nightly / on-demand Soroban sandbox E2E (#1117)
#
# Builds & deploys all five contracts on a local quickstart network, then runs
# the backend E2E suite against the live contracts. Kept separate from the fast
# unit CI because it is slow and requires Docker + Rust + Stellar CLI.

name: Soroban sandbox E2E

on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC daily
    - cron: '15 5 * * *'

concurrency:
  group: soroban-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soroban-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Start local Soroban network
        run: |
          docker compose -f scripts/soroban-sandbox/docker-compose.yml up -d
          chmod +x scripts/soroban-sandbox/wait-for-rpc.sh scripts/soroban-sandbox/deploy.sh
          ./scripts/soroban-sandbox/wait-for-rpc.sh

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      # Release asset names include the version, so the old unversioned
      # /latest/download URL 404s; -L follows GitHub's redirect to the asset.
      # No `cargo install` fallback: stellar-cli needs a far newer rustc than
      # the 1.81 toolchain pinned above for the contracts.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.1.0
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin stellar
          stellar --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy and initialize contracts
        run: |
          # Register a "local" network profile for the CLI when supported.
          stellar network add local \
            --rpc-url http://localhost:8000/soroban/rpc \
            --network-passphrase "Standalone Network ; February 2017" || true
          ./scripts/soroban-sandbox/deploy.sh

      - name: Run Soroban E2E suite
        env:
          SOROBAN_E2E: '1'
          JWT_SECRET: ci-jwt-secret-soroban-e2e
          NODE_ENV: test
        run: |
          set -a
          # shellcheck disable=SC1091
          source scripts/soroban-sandbox/.env.contracts
          set +a
          npx jest --runInBand --testPathPattern=tests/e2e/soroban

      - name: Dump sandbox logs on failure
        if: failure()
        run: docker compose -f scripts/soroban-sandbox/docker-compose.yml logs --tail=200 || true
